    <script>
      // Capture PWA installation prompt event as early as possible
      window.__edunova_deferred_prompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__edunova_deferred_prompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });
      window.addEventListener('appinstalled', function() {
        window.__edunova_deferred_prompt = null;
        try { localStorage.setItem('edunova_pwa_installed', 'true'); } catch(e) {}
      });
    </script>

        100% { transform: scale(1.2); opacity: 0.9; }
      }
      @keyframes splashLoad {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(60%); }
        100% { transform: translateX(220%); }
