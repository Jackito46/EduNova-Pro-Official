    <script>
      // Capture PWA installation prompt event as early as possible
      window.__edunova_deferred_prompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__edunova_deferred_prompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });
      window.addEventListener('appinstalled', function() {
        window.__edunova_deferred_prompt = null;
        try { localStorage.setItem('edunova_pwa_installed', 'true'); } catch(e) {}
      });
    </script>

    <style>
      :root {
        --brand-blue: #2563eb;
        --brand-sky: #38bdf8;
        --brand-indigo: #6366f1;
      }
      body {
        background-color: #0b132b;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      @keyframes edunovaAuraPulse {
        0%, 100% {
          transform: scale(0.96) translate3d(0, 0, 0);
          opacity: 0.45;
        }
        50% {
          transform: scale(1.18) translate3d(0, 0, 0);
          opacity: 0.85;
        }
      }
      @keyframes edunovaFloat {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @keyframes edunovaBarShimmer {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(35%);
        }
        100% {
          transform: translateX(180%);
        }
      }
      @keyframes edunovaOrbit {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes edunovaFadeIn {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .edunova-splash-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #0f1c3f 0%, #0b132b 65%, #070d1e 100%);
        color: #ffffff;
        z-index: 99999;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        padding: 24px;
        box-sizing: border-box;
        animation: edunovaFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .edunova-ambient-mesh {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: 
          radial-gradient(1px 1px at 20px 30px, rgba(255, 255, 255, 0.12), transparent),
          radial-gradient(1px 1px at 80px 70px, rgba(56, 189, 248, 0.15), transparent);
        background-size: 60px 60px;
        opacity: 0.35;
      }
      .edunova-logo-pod {
        position: relative;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: edunovaFloat 4s ease-in-out infinite;
      }
      .edunova-aura-back {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(37, 99, 235, 0.2) 40%, rgba(11, 19, 43, 0) 70%);
        filter: blur(20px);
        animation: edunovaAuraPulse 3s ease-in-out infinite;
      }
      .edunova-orbit-ring {
        position: absolute;
        width: 104px;
        height: 104px;
        border-radius: 28px;
        border: 1px dashed rgba(56, 189, 248, 0.25);
        animation: edunovaOrbit 20s linear infinite;
      }
      .edunova-icon-box {
        width: 80px;
        height: 80px;
        border-radius: 22px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 
          0 20px 40px -10px rgba(0, 0, 0, 0.7),
          0 0 30px -5px rgba(37, 99, 235, 0.3),
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
        position: relative;
        z-index: 2;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
      }
      .edunova-title-text {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 6px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      .edunova-tagline {
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        margin-bottom: 28px;
        opacity: 0.85;
      }
      .edunova-progress-track {
        width: 150px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .edunova-progress-indicator {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #2563eb, #38bdf8, #818cf8);
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.75);
        animation: edunovaBarShimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .edunova-status-badge {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 10.5px;
        font-weight: 500;
        color: #64748b;
        letter-spacing: 0.02em;
      }
      .edunova-pulse-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background-color: #38bdf8;
        box-shadow: 0 0 8px #38bdf8;
      }

<script>
  (function() {
    var startTime = performance.now();
    window.__edunovaAppReady = false;
    window.__edunovaDiagnostics = {
      startTime: new Date().toISOString(),
      environment: {
        url: window.location.href,
        hostname: window.location.hostname,
        protocol: window.location.protocol,
        userAgent: navigator.userAgent,
        hasServiceWorker: 'serviceWorker' in navigator,
        hasCaches: 'caches' in window,
        isPreview: window.location.hostname.includes('run.app') || 
                   window.location.hostname === 'localhost' || 
                   window.location.hostname === '127.0.0.1'
      },
      events: [],
      resourceFailures: [],
      errors: [],
      serviceWorkers: []
    };

    function logDiag(category, message, details) {
      var elapsed = Math.round(performance.now() - startTime);
      var entry = { elapsedMs: elapsed, category: category, message: message, details: details || null };
      window.__edunovaDiagnostics.events.push(entry);
      console.log('🔍 [EduNova Diag +' + elapsed + 'ms][' + category + ']', message, details || '');
    }

    logDiag('INIT', 'Script de diagnostic démarré', window.__edunovaDiagnostics.environment);

    // Fonction globale pour afficher le rapport de diagnostic dans la console
    window.getEduNovaDiagnostics = function() {
      console.group('📊 [EduNova Diagnostic Report]');
      console.table(window.__edunovaDiagnostics.events);
      if (window.__edunovaDiagnostics.errors.length > 0) {
        console.group('❌ Uncaught Errors / Rejections:');
        console.table(window.__edunovaDiagnostics.errors);
        console.groupEnd();
      }
      if (window.__edunovaDiagnostics.resourceFailures.length > 0) {
        console.group('⚠️ Resource Load Failures:');
        console.table(window.__edunovaDiagnostics.resourceFailures);
        console.groupEnd();
      }
      console.groupEnd();
      return window.__edunovaDiagnostics;
    };

    // Fonction de fermeture sécurisée du splashscreen
    window.__dismissEduNovaSplash = function() {
      logDiag('LIFECYCLE', 'Signal de fermeture du splashscreen reçu');
      var splash = document.getElementById('edunova-pwa-splash');
      if (splash) {
        splash.style.transition = 'opacity 0.25s ease-out';
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
            logDiag('LIFECYCLE', 'Splashscreen retiré du DOM');
          }
        }, 250);
      }
    };

    // =========================================================================
    // Détection & synchronisation stricte du Hash de Déploiement (Anti-Blocage SW)
    // =========================================================================
    var deployMeta = document.querySelector('meta[name="edunova-deploy-hash"]');
    var currentDeployHash = (deployMeta && deployMeta.content && !deployMeta.content.startsWith('%'))
      ? deployMeta.content.trim()
      : (typeof __DEPLOY_HASH__ !== 'undefined' ? __DEPLOY_HASH__ : '%DEPLOY_HASH%');
    window.__edunovaCurrentDeployHash = currentDeployHash;
    logDiag('DEPLOY', 'Hash de déploiement courant de la page', currentDeployHash);

    // En environnement de prévisualisation (run.app, localhost), désactiver formellement les rechargements SW
    var isPreviewEnv = window.__edunovaDiagnostics.environment.isPreview;
    if (isPreviewEnv) {
      logDiag('PREVIEW', 'Environnement Preview détecté : SW désactivé et purge silencieuse des caches sans rechargement.');
      try {
        localStorage.removeItem('edunova_active_sw_hash');
      } catch(e) {}
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var idx = 0; idx < regs.length; idx++) {
            regs[idx].unregister().catch(function() {});
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var cIdx = 0; cIdx < keys.length; cIdx++) {
            caches.delete(keys[cIdx]);
          }
        }).catch(function() {});
      }
    }

    // Fonction de purge et de désinscription forcée en cas de discordance (Production uniquement)
    function forceUnregisterAndReload(reason) {
      if (isPreviewEnv) {
        logDiag('SW_PREVIEW_SKIP', 'Rechargement SW ignoré en environnement Preview : ' + reason);
        return;
      }
      logDiag('SW_MISMATCH', 'Discordance de version détectée: ' + reason);
      console.warn('⚡ [EduNova PWA] ' + reason + ' -> Forçage unregister() immédiat et rechargement...');

      var antiLoopKey = 'edunova_sw_mismatch_reload';
      var lastReload = sessionStorage.getItem(antiLoopKey);
      var now = Date.now();
      // Protection anti-boucle : max 1 rechargement forcé par 10 secondes
      if (lastReload && (now - parseInt(lastReload, 10)) < 10000) {
        logDiag('SW_MISMATCH', 'Protection anti-boucle active, rechargement différé ou ignoré.');
        return;
      }
      sessionStorage.setItem(antiLoopKey, String(now));

      var unregisterPromise = ('serviceWorker' in navigator)
        ? navigator.serviceWorker.getRegistrations().then(function(regs) {
            return Promise.all(regs.map(function(r) {
              logDiag('SW_UNREGISTER', 'Désinscription forcée du Service Worker obsolète', r.scope);
              return r.unregister();
            }));
          }).catch(function(err) {
            logDiag('SW_ERR', 'Erreur désinscription SW obsolète', String(err));
          })
        : Promise.resolve();

      var cachePromise = ('caches' in window)
        ? caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) {
              logDiag('CACHE_PURGE', 'Purge du cache obsolète', k);
              return caches.delete(k);
            }));
          }).catch(function(err) {
            logDiag('CACHE_ERR', 'Erreur purge caches obsolètes', String(err));
          })
        : Promise.resolve();

      Promise.all([unregisterPromise, cachePromise]).then(function() {
        try {
          localStorage.setItem('edunova_active_sw_hash', currentDeployHash);
        } catch (e) {}
        logDiag('RELOAD', 'Rechargement immédiat pour appliquer les ressources du déploiement actuel');
        window.location.reload();
      }).catch(function() {
        window.location.reload();
      });
    }

    // Diagnostic et inspection des Service Workers & Caches (hors preview)
    if ('serviceWorker' in navigator && !isPreviewEnv) {
      var controller = navigator.serviceWorker.controller;
      logDiag('SW', 'Contrôleur Service Worker actuel', controller ? {
        scriptURL: controller.scriptURL,
        state: controller.state
      } : 'Aucun contrôleur actif');

      var storedSwHash = null;
      try {
        storedSwHash = localStorage.getItem('edunova_active_sw_hash');
      } catch (e) {}
      if (storedSwHash) {
        logDiag('SW', 'Hash SW stocké dans localStorage', storedSwHash);
      }

      var isValidDeployHash = currentDeployHash && !currentDeployHash.startsWith('%') && currentDeployHash !== 'unknown';

      // 1. Vérification par hash stocké : si un contrôleur est actif mais que le hash stocké ne correspond pas au hash de cette page
      if (controller && isValidDeployHash && storedSwHash && storedSwHash !== currentDeployHash) {
        forceUnregisterAndReload('Hash stocké obsolète avec contrôleur actif (' + storedSwHash + ' !== ' + currentDeployHash + ')');
      }

      // 2. Vérification dynamique en temps réel : interrogation directe du contrôleur en cours d'exécution
      if (controller && isValidDeployHash) {
        var channel = new MessageChannel();
        var swReplied = false;

        channel.port1.onmessage = function(event) {
          swReplied = true;
          var data = event.data;
          if (data && data.type === 'DEPLOY_HASH_RESPONSE') {
            var runningHash = data.deployHash;
            logDiag('SW', 'Hash d\'exécution rapporté par le contrôleur SW', runningHash);
            if (runningHash && runningHash !== currentDeployHash) {
              forceUnregisterAndReload('Discordance de hash du contrôleur SW (En exécution: ' + runningHash + ' !== Actuel: ' + currentDeployHash + ')');
            } else if (runningHash) {
              try { localStorage.setItem('edunova_active_sw_hash', runningHash); } catch(e) {}
            }
          }
        };

        try {
          controller.postMessage({ type: 'GET_DEPLOY_HASH' }, [channel.port2]);
        } catch (e) {
          logDiag('SW_WARN', 'Échec de l\'envoi du message GET_DEPLOY_HASH au contrôleur', String(e));
        }

        // Timeout de sécurité si le contrôleur en cours d'exécution est un ancien SW silencieux
        setTimeout(function() {
          if (!swReplied && controller) {
            var currentStored = null;
            try { currentStored = localStorage.getItem('edunova_active_sw_hash'); } catch(e) {}
            if (currentStored && currentStored !== currentDeployHash) {
              forceUnregisterAndReload('Contrôleur silencieux et hash obsolète en cache (' + currentStored + ' !== ' + currentDeployHash + ')');
            }
          }
        }, 500);
      }

      navigator.serviceWorker.getRegistrations().then(function(regs) {
        logDiag('SW', 'Nombre de Service Workers enregistrés trouvés', regs.length);
        for (var i = 0; i < regs.length; i++) {
          var r = regs[i];
          var swInfo = {
            scope: r.scope,
            active: r.active ? { scriptURL: r.active.scriptURL, state: r.active.state } : null,
            waiting: r.waiting ? { scriptURL: r.waiting.scriptURL, state: r.waiting.state } : null,
            installing: r.installing ? { scriptURL: r.installing.scriptURL, state: r.installing.state } : null
          };
          window.__edunovaDiagnostics.serviceWorkers.push(swInfo);
          logDiag('SW', 'Enregistrement SW #' + (i + 1), swInfo);

          if (window.__edunovaDiagnostics.environment.isPreview) {
            logDiag('SW', 'Désinscription du Service Worker sur environnement preview', r.scope);
            r.unregister().then(function(success) {
              logDiag('SW', 'Résultat désinscription SW: ' + (success ? 'Succès' : 'Échec'), r.scope);
            }).catch(function(err) {
              logDiag('SW_ERR', 'Erreur désinscription SW', String(err));
            });
          }
        }
      }).catch(function(err) {
        logDiag('SW_ERR', 'Erreur lors de la lecture des enregistrements SW', String(err));
      });

      if (window.__edunovaDiagnostics.environment.isPreview && 'caches' in window) {
        caches.keys().then(function(keys) {
          logDiag('CACHE', 'Caches PWA détectés', keys);
          for (var j = 0; j < keys.length; j++) {
            (function(cacheName) {
              caches.delete(cacheName).then(function(deleted) {
                logDiag('CACHE', 'Nettoyage du cache: ' + cacheName, { deleted: deleted });
              });
            })(keys[j]);
          }
        }).catch(function(err) {
          logDiag('CACHE_ERR', 'Erreur scan caches', String(err));
        });
      }
    }

    // Capture des erreurs de chargement de ressources (scripts, styles, polices) en phase de capture
    window.addEventListener('error', function(event) {
      var target = event.target;
      if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK' || target.tagName === 'IMG')) {
        var srcOrHref = target.src || target.href || 'inconnu';
        var failure = {
          tagName: target.tagName,
          source: srcOrHref,
          type: event.type,
          elapsedMs: Math.round(performance.now() - startTime)
        };
        window.__edunovaDiagnostics.resourceFailures.push(failure);
        logDiag('RESOURCE_ERR', 'Échec de chargement de ressource', failure);

        // Ne pas déclencher immédiatement l'écran d'urgence si l'application est en cours de montage
        setTimeout(function() {
          if (!window.__edunovaAppReady) {
            showEmergencyActions('Échec de chargement : ' + (srcOrHref.split('/').pop() || target.tagName));
          }
        }, 4000);
      } else {
        var errInfo = {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
          error: event.error ? (event.error.stack || event.error.message) : null
        };
        window.__edunovaDiagnostics.errors.push(errInfo);
        logDiag('SCRIPT_ERR', 'Erreur script non capturée', errInfo);

        setTimeout(function() {
          if (!window.__edunovaAppReady) {
            showEmergencyActions('Erreur : ' + (event.message || 'Script bloqué'));
          }
        }, 4000);
      }
    }, true);

    // Capture des rejets de Promesses non gérés
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      var reasonStr = reason ? (reason.stack || reason.message || String(reason)) : 'Raison inconnue';
      var rejInfo = {
        reason: reasonStr
      };
      window.__edunovaDiagnostics.errors.push(rejInfo);
      logDiag('PROMISE_ERR', 'Rejet de promesse non intercepté', rejInfo);

      // Si React est déjà prêt, ne pas perturber l'interface
      if (!window.__edunovaAppReady) {
        setTimeout(function() {
          if (!window.__edunovaAppReady) {
            showEmergencyActions('Erreur asynchrone : ' + (reason ? (reason.message || String(reason)) : 'Promesse non résolue'));
          }
        }, 4000);
      }
    });

    function showEmergencyActions(cause) {
      var actions = document.getElementById('edunova-splash-actions');
      if (actions && !window.__edunovaAppReady) {
        actions.style.display = 'flex';
        var hint = document.getElementById('edunova-splash-hint');
        if (hint && cause) {
          hint.textContent = 'Incident détecté (' + cause + '). Cliquez ci-dessous pour débloquer.';
          hint.style.color = '#f87171';
        }
        var btnLogin = document.getElementById('edunova-emergency-login');
        if (btnLogin) btnLogin.onclick = clearStorageAndGoLogin;
        var btnReload = document.getElementById('edunova-emergency-reload');
        if (btnReload) btnReload.onclick = clearStorageAndGoLogin;
      }
    }

    // Gestionnaire de réinitialisation d'urgence
    function clearStorageAndGoLogin() {
      logDiag('ACTION', 'Déclenchement réinitialisation complète du cache & session');
      try {
        localStorage.removeItem('edunova_user_profile');
        localStorage.removeItem('edunova-auth-token');
        localStorage.removeItem('supabase.auth.token');
        localStorage.setItem('edunova_logged_out', 'true');
        sessionStorage.clear();
      } catch(e) {}

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        });
      }

      window.location.href = window.location.pathname + '#/';
      setTimeout(function() {
        window.location.reload();
      }, 100);
    }

    // Watchdog : inspection de l'état après 8000ms (adapté aux connexions à latence et 19 Mbps)
    setTimeout(function() {
      if (!window.__edunovaAppReady) {
        logDiag('WATCHDOG', 'Délai d’attente dépassé (8000ms). L’application React n’a pas encore signalé son montage.');
        
        // Audit des ressources réseau chargées
        if (typeof performance !== 'undefined' && typeof performance.getEntriesByType === 'function') {
          var resources = performance.getEntriesByType('resource');
          var slowOrPending = resources.filter(function(r) { return r.duration > 1500; });
          logDiag('PERF_AUDIT', 'Ressources lentes (>1.5s) ou chargées', {
            totalResources: resources.length,
            slowCount: slowOrPending.length,
            slowList: slowOrPending.map(function(r) { return { name: r.name.split('/').pop(), durationMs: Math.round(r.duration) }; })
          });
        }

        showEmergencyActions('Délai d’attente dépassé');
      } else {
        logDiag('WATCHDOG', 'Vérification 8000ms : Application montée avec succès');
      }
    }, 8000);
  })();
</script>
