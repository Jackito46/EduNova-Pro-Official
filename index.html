    <script>
      // Capture PWA installation prompt event as early as possible
      window.__edunova_deferred_prompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__edunova_deferred_prompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-captured'));
      });
      window.addEventListener('appinstalled', function() {
        window.__edunova_deferred_prompt = null;
        try { localStorage.setItem('edunova_pwa_installed', 'true'); } catch(e) {}
      });
    </script>

    <style>
      :root {
        --brand-blue: #2563eb;
        --brand-sky: #38bdf8;
        --brand-indigo: #6366f1;
      }
      body {
        background-color: #0b132b;
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      @keyframes edunovaAuraPulse {
        0%, 100% {
          transform: scale(0.96) translate3d(0, 0, 0);
          opacity: 0.45;
        }
        50% {
          transform: scale(1.18) translate3d(0, 0, 0);
          opacity: 0.85;
        }
      }
      @keyframes edunovaFloat {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      @keyframes edunovaBarShimmer {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(35%);
        }
        100% {
          transform: translateX(180%);
        }
      }
      @keyframes edunovaOrbit {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes edunovaFadeIn {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .edunova-splash-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #0f1c3f 0%, #0b132b 65%, #070d1e 100%);
        color: #ffffff;
        z-index: 99999;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        padding: 24px;
        box-sizing: border-box;
        animation: edunovaFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .edunova-ambient-mesh {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: 
          radial-gradient(1px 1px at 20px 30px, rgba(255, 255, 255, 0.12), transparent),
          radial-gradient(1px 1px at 80px 70px, rgba(56, 189, 248, 0.15), transparent);
        background-size: 60px 60px;
        opacity: 0.35;
      }
      .edunova-logo-pod {
        position: relative;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: edunovaFloat 4s ease-in-out infinite;
      }
      .edunova-aura-back {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(56, 189, 248, 0.35) 0%, rgba(37, 99, 235, 0.2) 40%, rgba(11, 19, 43, 0) 70%);
        filter: blur(20px);
        animation: edunovaAuraPulse 3s ease-in-out infinite;
      }
      .edunova-orbit-ring {
        position: absolute;
        width: 104px;
        height: 104px;
        border-radius: 28px;
        border: 1px dashed rgba(56, 189, 248, 0.25);
        animation: edunovaOrbit 20s linear infinite;
      }
      .edunova-icon-box {
        width: 80px;
        height: 80px;
        border-radius: 22px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 
          0 20px 40px -10px rgba(0, 0, 0, 0.7),
          0 0 30px -5px rgba(37, 99, 235, 0.3),
          inset 0 1px 1px 0 rgba(255, 255, 255, 0.2);
        position: relative;
        z-index: 2;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        box-sizing: border-box;
      }
      .edunova-title-text {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin-bottom: 6px;
        color: #ffffff;
        display: flex;
        align-items: center;
        gap: 6px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      }
      .edunova-tagline {
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        margin-bottom: 28px;
        opacity: 0.85;
      }
      .edunova-progress-track {
        width: 150px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
      }
      .edunova-progress-indicator {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 45%;
        background: linear-gradient(90deg, #2563eb, #38bdf8, #818cf8);
        border-radius: 999px;
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.75);
        animation: edunovaBarShimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .edunova-status-badge {
        margin-top: 18px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 10.5px;
        font-weight: 500;
        color: #64748b;
        letter-spacing: 0.02em;
      }
      .edunova-pulse-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background-color: #38bdf8;
        box-shadow: 0 0 8px #38bdf8;
      }
    </style>
</head>
<body style="background-color: #0b132b; color: #ffffff;">

        <div class="edunova-title-text">
